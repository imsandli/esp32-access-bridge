name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: hw
    attributes:
      label: Hardware revision
      placeholder: HW-1.0 Rev A
    validations:
      required: true
  - type: input
    id: fw
    attributes:
      label: Firmware version
      placeholder: FW-1.0.0
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Zigbee2MQTT / Home Assistant versions
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (ESPHome serial log, HA logbook / system log "accessbridge")
      render: text
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is NOT a security vulnerability (report those privately via GitHub security advisories)
          required: true
