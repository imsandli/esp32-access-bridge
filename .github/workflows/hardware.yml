name: hardware

on:
  push:
    branches: ["**"]
    paths: ["hardware/**", "scripts/**", ".github/workflows/hardware.yml"]
  pull_request:
    paths: ["hardware/**", "scripts/**", ".github/workflows/hardware.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  kicad:
    name: ERC, DRC, fabrication data
    runs-on: ubuntu-24.04
    container:
      # Pinned KiCad version; must match the version used to save the design.
      image: kicad/kicad:9.0.9
      options: --user root
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v5

      - name: ERC and DRC (fails on any error or warning)
        run: |
          scripts/validate-hardware.sh
          echo "::notice title=ERC/DRC::$(grep -h -E 'ERC messages|Found' build/reports/erc.rpt build/reports/drc.rpt | tr -s ' *' ' ' | tr '\n' ';')"

      - name: Keep committed fabrication data for comparison
        run: |
          mkdir -p build
          cp -r hardware/manufacturing build/committed

      - name: BOM and pick-and-place
        run: scripts/export-bom.sh

      - name: Gerbers, drill, schematic PDF, drawings
        run: scripts/export-gerbers.sh --no-renders

      - name: Committed fabrication data matches the KiCad sources
        run: |
          python3 scripts/tools/check_generated.py build/committed hardware/manufacturing | tee build/reports/generated.txt
          echo "::notice title=Fabrication data::$(cat build/reports/generated.txt)"

      - name: Upload fabrication data
        uses: actions/upload-artifact@v4
        with:
          name: accessbridge-c6-fabrication
          path: |
            hardware/manufacturing/
            hardware/docs/schematic.pdf
            hardware/docs/assembly-top.pdf
            hardware/enclosure/drawings/
            build/reports/
          if-no-files-found: error

  enclosure:
    name: 3D-printed enclosure (fit check + model consistency)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned CadQuery environment
        run: pip install -r hardware/enclosure/requirements.txt
      - name: Fit check against the PCB STEP
        run: |
          python hardware/enclosure/check_fit.py | tee /tmp/fit.txt
          echo "::notice title=Enclosure fit::$(tail -n 4 /tmp/fit.txt | tr '\n' ';')"
      - name: Committed STL/STEP match the CadQuery source
        run: |
          python hardware/enclosure/models/accessbridge_enclosure.py --out build/enclosure
          python scripts/tools/check_enclosure_models.py hardware/enclosure/models build/enclosure | tee /tmp/models.txt
          echo "::notice title=Enclosure models::$(cat /tmp/models.txt)"
      - name: Upload print files
        uses: actions/upload-artifact@v4
        with:
          name: accessbridge-enclosure
          path: |
            build/enclosure/*.stl
            build/enclosure/*.step
          if-no-files-found: error
