name: release

# A release bundles exactly one hardware revision and one firmware version.
# Tag format: HW-<hw>_FW-<fw>, e.g. HW-1.0_FW-1.0.0
# The tag must match hardware/kicad/accessbridge.kicad_pro (HW_VERSION) and
# firmware/esphome/accessbridge.yaml (fw_version), otherwise the release fails.

on:
  push:
    tags: ["HW-*_FW-*"]

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      hw: ${{ steps.v.outputs.hw }}
      fw: ${{ steps.v.outputs.fw }}
      rev: ${{ steps.v.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check tag against source versions
        run: |
          TAG="${GITHUB_REF_NAME}"
          HW="${TAG%%_FW-*}"; FW="${TAG#*_FW-}"
          SRC_HW=$(python3 -c "import json;print(json.load(open('hardware/kicad/accessbridge.kicad_pro'))['text_variables']['HW_VERSION'])")
          SRC_REV=$(python3 -c "import json;print(json.load(open('hardware/kicad/accessbridge.kicad_pro'))['text_variables']['PCB_REV'])")
          SRC_FW=$(grep -E '^\s+fw_version:' firmware/esphome/accessbridge.yaml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "tag: $HW / FW-$FW   sources: $SRC_HW Rev $SRC_REV / FW-$SRC_FW"
          test "$HW" = "$SRC_HW" || { echo "::error::tag $HW != HW_VERSION $SRC_HW"; exit 1; }
          test "$FW" = "$SRC_FW" || { echo "::error::tag FW-$FW != fw_version $SRC_FW"; exit 1; }
          echo "hw=$HW" >> "$GITHUB_OUTPUT"; echo "fw=$FW" >> "$GITHUB_OUTPUT"; echo "rev=$SRC_REV" >> "$GITHUB_OUTPUT"

  hardware:
    needs: versions
    uses: ./.github/workflows/hardware.yml

  firmware:
    needs: versions
    uses: ./.github/workflows/firmware.yml

  publish:
    needs: [versions, hardware, firmware]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Assemble release assets
        env:
          HW: ${{ needs.versions.outputs.hw }}
          FW: ${{ needs.versions.outputs.fw }}
          REV: ${{ needs.versions.outputs.rev }}
        run: |
          set -euo pipefail
          mkdir -p out
          F=dl/accessbridge-c6-fabrication
          cp dl/accessbridge-zigbee-firmware/*.bin out/
          cp "$F"/hardware/manufacturing/accessbridge-c6-*-gerbers.zip out/
          cp "$F"/hardware/manufacturing/bom/accessbridge-jlcpcb-bom.csv out/accessbridge-c6-${HW}-rev${REV}-jlcpcb-bom.csv
          cp "$F"/hardware/manufacturing/bom/accessbridge-bom-full.csv out/accessbridge-c6-${HW}-rev${REV}-bom-full.csv
          cp "$F"/hardware/manufacturing/bom/accessbridge-manual-assembly.csv out/accessbridge-c6-${HW}-rev${REV}-manual-assembly.csv
          cp "$F"/hardware/manufacturing/pick-and-place/accessbridge-jlcpcb-cpl.csv out/accessbridge-c6-${HW}-rev${REV}-jlcpcb-cpl.csv
          cp "$F"/hardware/docs/schematic.pdf out/accessbridge-c6-${HW}-rev${REV}-schematic.pdf
          cp "$F"/hardware/enclosure/drawings/accessbridge-c6-dimensions.pdf out/accessbridge-c6-${HW}-rev${REV}-dimensions.pdf
          (cd out && sha256sum * > SHA256SUMS)
          {
            echo "## AccessBridge release: hardware ${HW} (PCB Rev ${REV}) + firmware FW-${FW}"
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| Hardware | AccessBridge C6 ${HW}, PCB Rev ${REV} |"
            echo "| Firmware | AccessBridge Zigbee FW-${FW} (ESPHome 2026.9.1) |"
            echo
            echo "All files were generated by CI from the tagged sources (ERC/DRC clean,"
            echo "firmware compiled). See [CHANGELOG.md](CHANGELOG.md) for changes and the"
            echo "test status of this combination. **Test status is not implied by this"
            echo "release:** check the compatibility table in README.md before use."
            echo
            echo "### Files"
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "AccessBridge ${{ needs.versions.outputs.hw }} Rev ${{ needs.versions.outputs.rev }} / FW-${{ needs.versions.outputs.fw }}" \
            --notes-file notes.md --verify-tag
