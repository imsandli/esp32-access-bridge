# Doorbell on IN2 (opto U4) via a certified 230 V coupling relay (see
# hardware/docs/wiring.md). Same counting rules as the relay input. The
# doorbell is informational only and must never be used to unlock.

globals:
  - id: bell_pulse_count
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: bell_last_pulse_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

binary_sensor:
  - platform: gpio
    id: doorbell
    name: doorbell
    endpoint: 2
    report: force
    pin:
      number: ${pin_in_bell}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: ${debounce}
      - delayed_off: ${debounce}
    trigger_on_initial_state: false
    on_state_change:
      - lambda: |-
          if (!x.has_value() || !*x)
            return;
          if (!x_previous.has_value() || *x_previous || !id(zb).is_joined())
            return;
          const uint32_t now = millis();
          if (id(bell_pulse_count) > 0 && now - id(bell_last_pulse_ms) < ${min_pulse_interval_ms})
            return;
          id(bell_last_pulse_ms) = now;
          id(bell_pulse_count) += 1;
          ESP_LOGI("doorbell", "doorbell press #%u", (unsigned) id(bell_pulse_count));
          id(doorbell_pulses).publish_state(id(bell_pulse_count));

sensor:
  - platform: template
    id: doorbell_pulses
    name: doorbell_pulses
    endpoint: 2
    report: force
    accuracy_decimals: 0
    update_interval: never
    lambda: return id(bell_pulse_count);
